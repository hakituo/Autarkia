org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=summary

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=35
# 关闭 IDE Run 部署时向 APK 注入 testOnly 标记，否则 Android Studio 直接 Run
# 生成的包手动传到其它设备（平板/手机）安装会被系统拒绝，报"解析安装包出错"
# （adb 报 INSTALL_FAILED_TEST_ONLY）。设为 false 后 Run 产物可正常侧载。
android.injected.testOnly=false

kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official

# 规避 KSP 2.0.21-1.0.28 增量编译重复输出同一 Factory 类导致 "类重复" 编译失败
ksp.incremental=false

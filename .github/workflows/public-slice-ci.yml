name: Public Slice Check

# 公开切片仓库（hakituo/Autarkia）专用流水线。
# 公开仓库不含角色资料与运行配置，装不了完整依赖，因此：
#   - tests/conftest.py 会给缺失的角色系统模块注入占位壳，测试可正常导入；
#   - 这里只运行不依赖重库（torch / transformers 等）的那批单元测试；
#   - 完整业务测试在私有主仓库的 core-ci 中执行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python 语法
    if: github.repository == 'hakituo/Autarkia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 全量编译检查
        run: python -m compileall -q core routers memory clients config maintenance scripts tests

  tests:
    name: 单元测试
    if: github.repository == 'hakituo/Autarkia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装轻量依赖
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest python-dotenv pyyaml structlog pytz \
            pydantic pydantic-settings

      - name: 运行不依赖重库的单元测试
        run: |
          python -m pytest \
            tests/unit/test_yaml_loader.py \
            tests/unit/test_markov_trim.py \
            tests/unit/test_data_paths_scope.py \
            tests/unit/test_data_paths_migrations.py \
            -q -o addopts= -p no:cacheprovider \
            -k "not test_build_shared_persona_conversation_id and not test_migrate_persona_export_renames"

  layout:
    name: 文档与清单
    if: github.repository == 'hakituo/Autarkia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新日志索引非空
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          index = Path("docs/updates/README.md").read_text(encoding="utf-8")
          listed = len(re.findall(r"^\|\s*\[", index, flags=re.M))
          actual = len(list(Path("docs/updates").rglob("*.md"))) - 1
          print(f"索引条目 {listed} / 实际文件 {actual}")
          if listed == 0:
              print("ERROR: 更新日志索引为空")
              sys.exit(1)
          print("更新日志索引 OK")
          PY
